# Despliegue del backend FastAPI en Render (plan gratuito)
services:
  - type: web
    name: utm-desk-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: utm_desk
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: Evidencias
